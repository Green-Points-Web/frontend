<main class="main-container">
  <section class="view-section">
    <header class="section-header">
      <div>
        <span class="card-super-title">TU RECORRIDO</span>
        <h1 class="main-heading">Historial de acciones</h1>
        <p class="main-subtitle">Consulta todas las acciones sostenibles que has realizado.</p>
      </div>
      <div>
        <button class="btn-primary" type="button">
          <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
          </svg>
          <span>Registrar acción</span>
        </button>
      </div>
    </header>
    <div class="history-kpi-bar">
      <div class="history-stat"><span class="bold">7</span> acciones</div>
      <div class="history-divider"></div>
      <div class="history-stat"><span class="bold">210</span> puntos</div>
      <div class="history-divider"></div>
      <div class="history-stat"><span class="bold">15 kg</span> CO₂ ahorrados</div>
    </div>
    <div class="filter-bar">
      <div class="search-box-wrapper">
        <div class="search-icon">
          <svg class="icon-sm text-slate" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
              stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
        <input class="search-input" id="search-input" onkeyup="filterHistory()" placeholder="Buscar en tus acciones..."
          type="text">
      </div>
    </div>
    <select class="select-filter" id="category-filter" onchange="filterHistory()">
      <option value="all">Todas las categorías</option>
      <option value="Movilidad">Movilidad</option>
      <option value="Naturaleza">Naturaleza</option>
      <option value="Participación">Participación</option>
      <option value="Reciclaje">Reciclaje</option>
    </select>
