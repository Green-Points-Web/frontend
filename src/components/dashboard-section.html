
<section id="dashboard" class="dashboard-section" aria-labelledby="dashboard-title">
    <header class="dashboard-header">
        <h2 id="dashboard-title">Dashboard Summary</h2>
        <p>Track your sustainability progress and environmental impact.</p>
    </header>

    <div class="dashboard-metrics">

        <article class="metric-card" aria-labelledby="points-title">
            <h3 id="points-title">Total Points</h3>
            <p class="metric-value" id="total-points">0</p>
            <p class="metric-description">Points accumulated</p>
        </article>

        <article class="metric-card" aria-labelledby="level-title">
            <h3 id="level-title">Current Level</h3>
            <p class="metric-value" id="current-level">Seed</p>
            <p class="metric-description">Your sustainability level</p>
        </article>

        <article class="metric-card" aria-labelledby="impact-title">
            <h3 id="impact-title">CO₂ Impact</h3>
            <p class="metric-value" id="co2-impact">0 kg</p>
            <p class="metric-description">Estimated CO₂ savings</p>
        </article>

        <article class="metric-card" aria-labelledby="actions-title">
            <h3 id="actions-title">Total Actions</h3>
            <p class="metric-value" id="total-actions">0</p>
            <p class="metric-description">Sustainability actions completed</p>
        </article>

    </div>
</section>
