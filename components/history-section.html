<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="GreenPoints: registra tus acciones sostenibles, consigue puntos y consulta tu impacto ambiental." />
  <title>GreenPoints</title>
  <link rel="stylesheet" href="../src/css/base.css" />
  <link rel="stylesheet" href="../src/css/history.css" />
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">GreenPoints</h1>
    <nav class="main-nav" aria-label="Navegación principal">
      <ul class="main-nav__list">
        <li><a class="main-nav__link" href="../index.html">Resumen</a></li>
        <li><a class="main-nav__link" href="#registro">Acciones</a></li>
        <li><a class="main-nav__link" href="./src/components/history-section.html">Historial</a></li>
      </ul>
    </nav>
    <button type="button" id="open-modal-btn" class="btn btn--primary">Registro de acción</button>
  </header>
  <main class="main-container">
    <section class="view-section">
      <header class="section-header">
        <div>
          <span class="card-super-title">TU RECORRIDO</span>
          <h1 class="main-heading">Historial de acciones</h1>
          <p class="main-subtitle">Consulta todas las acciones sostenibles que has realizado.</p>
        </div>
        <div>
          <button class="btn-primary" type="button">
            <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
            </svg>
            <span>Registrar acción</span>
          </button>
        </div>
      </header>
      <div class="history-kpi-bar">
        <div class="history-stat"><span class="bold">7</span> acciones</div>
        <div class="history-divider"></div>
        <div class="history-stat"><span class="bold">210</span> puntos</div>
        <div class="history-divider"></div>
        <div class="history-stat"><span class="bold">15 kg</span> CO₂ ahorrados</div>
      </div>

      <div class="filter-bar">
        <div class="search-box-wrapper">
          <div class="search-icon">
            <svg class="icon-sm text-slate" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
                stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </div>
          <input class="search-input" id="search-input" onkeyup="filterHistory()"
            placeholder="Buscar en tus acciones..." type="text">

          <select class="select-filter" id="category-filter" onchange="filterHistory()">
            <option value="all">Todas las categorías</option>
            <option value="Movilidad">Movilidad</option>
            <option value="Naturaleza">Naturaleza</option>
            <option value="Participación">Participación</option>
            <option value="Reciclaje">Reciclaje</option>
          </select>
        </div>
      </div>

      <div class="card table-card">
        <div class="table-responsive">
          <table class="history-table">
            <thead>
              <tr>
                <th class="th-left">ACCIÓN</th>
                <th class="th-general">FECHA</th>
                <th class="th-general">CATEGORÍA</th>
                <th class="th-general">IMPACTO</th>
                <th class="th-general">PUNTOS</th>
              </tr>
            </thead>
            <tbody id="history-table-body"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <script src="js/main.js" type="module"></script>
  <script src="js/history.js" type="module"> </script>
  <script src="js/services/historyService.js" type="module"></script>
  <script src="js/components/historyComponent.js" type="module"></script>
</body>
</html>
