<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="GreenPoints: log your everyday sustainable habits, get points and consult your environmental impact.">
    <title>GreenPoints · Acciones</title>
    <link rel="icon" type="image/png" href="../src/img/logo.png">
</head>

<body>

    <main>

        <section class="sustainable-catalog">

            <div class="catalog-header">
                <span class="badge-catalog"><span class="material-symbols-outlined" aria-hidden="true">emoji_nature</span>CATÁLOGO SOSTENIBLE</span>
                <h2>Elige tu próxima acción</h2>
                <p>Convierte tus hábitos diarios en un impacto positivo para el planeta.</p>
            </div>

            <div class="actions-grid" id="catalog-grid"></div>

            <div class="empty-state" id="empty-state" hidden>
                <p class="empty-title">No se encontraron acciones</p>
                <p class="empty-text">Prueba con otra búsqueda o selecciona otra categoría.</p>
            </div>

        </section>

    </main>
