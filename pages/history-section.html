<section class="view-section" aria-labelledby="history-title">

  <header class="section-header">
    <div>
      <span class="card-super-title">TU RECORRIDO</span>
      <h2 class="main-heading" id="history-title">Historial de acciones</h2>
      <p class="main-subtitle">Consulta todas las acciones sostenibles que has realizado.</p>
    </div>
  </header>

  <section class="history-kpi-bar" aria-label="Resumen de impacto">
    <span class="history-stat"><strong id="kpi-actions">0</strong> acciones</span>
    <span class="history-divider" aria-hidden="true"></span>
    <span class="history-stat"><strong id="kpi-points">0</strong> puntos</span>
    <span class="history-divider" aria-hidden="true"></span>
    <span class="history-stat"><strong id="kpi-co2">0 kg</strong> CO₂ evitados</span>
  </section>

  <section class="filter-bar" aria-label="Búsqueda y filtros">
    <div class="search-box-wrapper">
      <span class="material-symbols-outlined" aria-hidden="true">search</span>
      <input type="text" id="search-input" class="search-input" aria-label="Buscar en tus acciones"
        placeholder="Buscar en tus acciones..." autocomplete="off">
    </div>

    <div class="filter" id="filter">
      <span class="material-symbols-outlined" aria-hidden="true">filter_list</span>
      <select id="filter-select" class="select-filter" aria-label="Filtrar por categoría">
        <option value="Todas">Todas las categorías</option>
        <option value="Movilidad">Movilidad</option>
        <option value="Naturaleza">Naturaleza</option>
        <option value="Participación">Participación</option>
        <option value="Reciclaje">Reciclaje</option>
      </select>
    </div>
  </section>

  <div class="card table-card">
    <div class="table-responsive">
      <table class="history-table">
        <thead>
          <tr>
            <th scope="col" class="th-left">ACCIÓN</th>
            <th scope="col" class="th-general">FECHA</th>
            <th scope="col" class="th-general">CATEGORÍA</th>
            <th scope="col" class="th-general">IMPACTO</th>
            <th scope="col" class="th-right">PUNTOS</th>
            <th scope="col" class="th-general" aria-label="Editar"></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <div class="empty-state" id="empty-state" hidden>
      <p class="empty-title">No se encontraron acciones</p>
      <p class="empty-text">Prueba con otra búsqueda o selecciona otra categoría.</p>
    </div>

    <nav class="pagination" id="pagination" aria-label="Paginación del historial" hidden>
      <button type="button" id="page-prev" class="page-btn" aria-label="Página anterior">
        <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
      </button>
      <span id="pagination-info" class="pagination-info">Página 1 de 1</span>
      <button type="button" id="page-next" class="page-btn" aria-label="Página siguiente">
        <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
      </button>
    </nav>
  </div>
</section>
