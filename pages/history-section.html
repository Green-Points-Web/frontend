
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="GreenPoints: log your everyday sustainable habits, get points and consult your environmental impact." />
  <title>GreenPoints</title>
  <link rel="stylesheet" href="../src/css/base.css" />
  <link rel="stylesheet" href="../src/css/layout.css" />
  <link rel="stylesheet" href="../src/css/history.css" />
</head>
<body>
  <main class="main-container">
    <section class="view-section">
      
      <header class="section-header">
        <div>
          <span class="card-super-title">TU RECORRIDO</span>
          <h1 class="main-heading">Historial de acciones</h1>
          <p class="main-subtitle">Consulta todas las acciones sostenibles que has realizado.</p>
        </div>
      </header>

      <section class="history-kpi-bar" aria-label="Resumen de impacto">
        <span class="history-stat"><strong id="kpi-actions">0</strong> acciones</span>
        <span class="history-divider" aria-hidden="true"></span>
        <span class="history-stat"><strong id="kpi-points">0</strong> puntos</span>
        <span class="history-divider" aria-hidden="true"></span>
        <span class="history-stat"><strong id="kpi-co2">0 kg</strong> CO₂ evitados</span>
      </section>

      <section class="filter-bar" aria-label="Búsqueda y filtros">
        <div class="search-box-wrapper">
          <span class="material-symbols-outlined" aria-hidden="true">search</span>
          <input type="text" id="search-input" class="search-input" placeholder="Buscar en tus acciones..." autocomplete="off">
        </div>

        <div class="filter" id="filter">
          <span class="material-symbols-outlined" aria-hidden="true">filter_list</span>
          <select id="filter-select" class="select-filter" aria-label="Filtrar por categoría">
            <option value="Todas">Todas las categorías</option>
            <option value="Movilidad">Movilidad</option>
            <option value="Naturaleza">Naturaleza</option>
            <option value="Participación">Participación</option>
            <option value="Reciclaje">Reciclaje</option>
          </select>
        </div>
      </section>
      
      <div class="card table-card">
        <div class="table-responsive">
          <table class="history-table">
            <thead>
              <tr>
                <th scope="col" class="th-left">ACCIÓN</th>
                <th scope="col" class="th-general">FECHA</th>
                <th scope="col" class="th-general">CATEGORÍA</th>
                <th scope="col" class="th-general">IMPACTO</th>
                <th scope="col" class="th-right">PUNTOS</th>
                <th scope="col" class="th-general"><span class="sr-only">Editar</span></th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>

        <div class="empty-state" id="empty-state">
          <p class="empty-title">No se encontraron acciones</p>
          <p class="empty-text">Prueba con otra búsqueda o selecciona otra categoría.</p>
        </div>
      </div>
      <input class="search-input" id="search-input" onkeyup="filterHistory()"
        placeholder="Buscar en tus acciones..." type="text">
    </div>

    <div class="category-filter-wrapper">
      <select class="select-filter" id="category-filter" onchange="filterHistory()">
        <option value="all">Todas las categorías</option>
        <option value="Movilidad">Movilidad</option>
        <option value="Naturaleza">Naturaleza</option>
        <option value="Participación">Participación</option>
        <option value="Reciclaje">Reciclaje</option>
      </select>
    </div>
  </div>

      <form id="action-form" novalidate>
        <div class="form-field">
          <label for="f-name">Nombre de la acción</label>
          <input type="text" id="f-name" required maxlength="60" placeholder="Ej. Plantar un árbol">
        </div>

        <div class="form-field">
          <label for="f-desc">Descripción</label>
          <input type="text" id="f-desc" required maxlength="100" placeholder="Ej. Jornada de reforestación">
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="f-date">Fecha</label>
            <input type="date" id="f-date" required>
          </div>
          <div class="form-field">
            <label for="f-category">Categoría</label>
            <select id="f-category" required>
              <option value="Movilidad">Movilidad</option>
              <option value="Naturaleza">Naturaleza</option>
              <option value="Participación">Participación</option>
              <option value="Reciclaje">Reciclaje</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="f-kg">CO₂ evitado (kg)</label>
            <input type="number" id="f-kg" min="0" step="0.1" required placeholder="0">
          </div>
          <div class="form-field">
            <label for="f-points">Puntos</label>
            <input type="number" id="f-points" min="0" step="1" required placeholder="0">
          </div>
        </div>

        <footer class="modal-footer">
          <button type="button" class="btn btn-danger" id="btn-delete">
            <span class="delete-icon icon-element" aria-hidden="true"></span>
            Eliminar
          </button>
          <div class="modal-footer-right">
            <button type="button" class="btn btn-secondary" id="btn-cancel">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </footer>
      </form>
    </div>
  </div>
</section>
  </main>
  <script type="module" src="../src/js/main.js"></script>
  <script type="module" src="../src/js/dashboard.js"></script>
  <script type="module" src="../src/js/components/historyComponent.js"></script>
  <script type="module" src="../src/js/components/registrationModal.js"></script>
  <script type="module" src="../src/js/services/historyService.js"></script>
</body>
</html>
