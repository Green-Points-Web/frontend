<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="GreenPoints: log your everyday sustainable habits, get points and consult your environmental impact." />
  <title>GreenPoints</title>
  <link rel="stylesheet" href="../src/css/base.css" />
  <link rel="stylesheet" href="../src/css/layout.css" />
  <link rel="stylesheet" href="../src/css/history.css" />
</head>
<body>
  <main class="main-container">
<section class="view-section">
  <header class="section-header">
    <div>
      <span class="card-super-title">TU RECORRIDO</span>
      <h1 class="main-heading">Historial de acciones</h1>
      <p class="main-subtitle">Consulta todas las acciones sostenibles que has realizado.</p>
    </div>
  </header>

  <div class="history-kpi-bar">
    <div class="history-stat"><span class="bold">7</span> acciones</div>
    <div class="history-divider"></div>
    <div class="history-stat"><span class="bold">210</span> puntos</div>
    <div class="history-divider"></div>
    <div class="history-stat"><span class="bold">15 kg</span> CO₂ ahorrados</div>
  </div>

  <div class="filter-bar">
    <div class="search-box-wrapper">
      <div class="search-icon">
        <svg class="icon-sm text-slate" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
            stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </div>
      <input class="search-input" id="search-input" onkeyup="filterHistory()"
        placeholder="Buscar en tus acciones..." type="text">
    </div>

    <div class="category-filter-wrapper">
      <select class="select-filter" id="category-filter" onchange="filterHistory()">
        <option value="all">Todas las categorías</option>
        <option value="Movilidad">Movilidad</option>
        <option value="Naturaleza">Naturaleza</option>
        <option value="Participación">Participación</option>
        <option value="Reciclaje">Reciclaje</option>
      </select>
    </div>
  </div>

  <div class="card table-card">
    <div class="table-responsive">
      <table class="history-table">
        <thead>
          <tr>
            <th class="th-left">ACCIÓN</th>
            <th class="th-general">FECHA</th>
            <th class="th-general">CATEGORÍA</th>
            <th class="th-general">IMPACTO</th>
            <th class="th-general">PUNTOS</th>
          </tr>
        </thead>
        <tbody id="history-table-body"></tbody>
      </table>
    </div>
  </div>
</section>
  </main>
  <script type="module" src="../src/js/main.js"></script>
  <script type="module" src="../src/js/dashboard.js"></script>
  <script type="module" src="../src/js/components/historyComponent.js"></script>
  <script type="module" src="../src/js/components/registrationModal.js"></script>
  <script type="module" src="../src/js/services/historyService.js"></script>
</body>
</html>
