<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial de acciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/css/base.css" />
  <link rel="stylesheet" href="../src/css/history.css" />
</head>
<body>
  <main class="main-container">
<section class="view-section">
  <header class="section-header">
    <div>
      <span class="card-super-title">TU RECORRIDO</span>
      <h1 class="main-heading">Historial de acciones</h1>
      <p class="main-subtitle">Consulta todas las acciones sostenibles que has realizado.</p>
    </div>
  </header>

  <section class="kpi-bar" aria-label="Resumen de impacto">
      <span class="kpi-item"><strong id="kpi-actions">0</strong> acciones</span>
      <span class="kpi-divider" aria-hidden="true"></span>
      <span class="kpi-item"><strong id="kpi-points">0</strong> puntos</span>
      <span class="kpi-divider" aria-hidden="true"></span>
      <span class="kpi-item"><strong id="kpi-co2">0 kg</strong> CO₂ evitados</span>
    </section>
<section class="toolbar" aria-label="Búsqueda y filtros">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Buscar en tus acciones..." autocomplete="off">
      </div>

      <div class="filter" id="filter">
        <button type="button" class="filter-btn" id="filter-btn" aria-haspopup="listbox" aria-expanded="false">
          <span class="filter-btn-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M3 4.5h18m-14 7.5h10m-6 7.5h2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="filter-label">Todas</span>
          </span>
          <svg class="filter-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="m19.5 8.25-7.5 7.5-7.5-7.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <ul class="filter-menu" id="filter-menu" role="listbox" hidden></ul>
      </div>
    </section>
    
    <div class="table-card">
      <div class="table-scroll">
        <table class="actions-table">
          <thead>
            <tr>
              <th scope="col">Acción</th>
              <th scope="col">Fecha</th>
              <th scope="col">Categoría</th>
              <th scope="col">Impacto</th>
              <th scope="col" class="th-points">Puntos</th>
              <th scope="col"><span class="sr-only">Editar</span></th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <div class="empty-state" id="empty-state" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="empty-title">No se encontraron acciones</p>
        <p class="empty-text">Prueba con otra búsqueda o selecciona otra categoría.</p>
      </div>
    </div>
  </main>

  <!-- ========== MODAL ========== -->
  <div class="modal-overlay" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <h2 id="modal-title">Editar acción</h2>
        <button type="button" class="icon-btn" id="btn-close" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </header>

      <form id="action-form" novalidate>
        <div class="form-field">
          <label for="f-name">Nombre de la acción</label>
          <input type="text" id="f-name" required maxlength="60" placeholder="Ej. Plantar un árbol">
        </div>

        <div class="form-field">
          <label for="f-desc">Descripción</label>
          <input type="text" id="f-desc" required maxlength="100" placeholder="Ej. Jornada de reforestación">
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="f-date">Fecha</label>
            <input type="date" id="f-date" required>
          </div>
          <div class="form-field">
            <label for="f-category">Categoría</label>
            <select id="f-category" required>
              <option value="Participación">Participación</option>
              <option value="Naturaleza">Naturaleza</option>
              <option value="Movilidad">Movilidad</option>
              <option value="Reciclaje">Reciclaje</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="f-kg">CO₂ evitado (kg)</label>
            <input type="number" id="f-kg" min="0" step="0.1" required placeholder="0">
          </div>
          <div class="form-field">
            <label for="f-points">Puntos</label>
            <input type="number" id="f-points" min="0" step="1" required placeholder="0">
          </div>
        </div>

        <footer class="modal-footer">
          <button type="button" class="btn btn-danger" id="btn-delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Eliminar
          </button>
          <div class="modal-footer-right">
            <button type="button" class="btn btn-secondary" id="btn-cancel">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </footer>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  
  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/dashboard.js"></script>
  <script type="module" src="../js/components/historyComponent.js"></script>
  <script type="module" src="../js/components/registrationModal.js"></script>
  <script type="module" src="../js/services/historyService.js"></script>
</body>
</html>
