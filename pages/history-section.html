<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="GreenPoints: log your everyday sustainable habits, get points and consult your environmental impact." />
  <title>GreenPoints</title>
  <link rel="stylesheet" href="../src/css/base.css" />
  <link rel="stylesheet" href="../src/css/layout.css" />
  <link rel="stylesheet" href="../src/css/history.css" />
</head>
<body>
  <main class="main-container">
<section class="view-section">
  <header class="section-header">
    <div>
      <span class="card-super-title">TU RECORRIDO</span>
      <h1 class="main-heading">Historial de acciones</h1>
      <p class="main-subtitle">
        Consulta todas las acciones sostenibles que has realizado.
      </p>
    </div>
  </header>

  <div class="history-kpi-bar" aria-label="Resumen de tu actividad">
    <div class="history-stat">
      <span class="history-stat-value" id="history-total-actions">—</span>
      <span>acciones</span>
    </div>

    <div class="history-divider" aria-hidden="true"></div>

    <div class="history-stat">
      <span class="history-stat-value" id="history-total-points">—</span>
      <span>puntos</span>
    </div>

    <div class="history-divider" aria-hidden="true"></div>

    <div class="history-stat">
      <span class="history-stat-value" id="history-total-co2">—</span>
      <span>CO₂ ahorrados</span>
    </div>
  </div>

  <div class="filter-bar">
    <div class="search-box-wrapper">
      <label class="search-icon" for="search-input" aria-label="Buscar acciones">
        <svg
          class="icon-sm"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m16 16 4 4" stroke-linecap="round"></path>
        </svg>
      </label>

      <input
        class="search-input"
        id="search-input"
        type="search"
        placeholder="Buscar en tus acciones..."
        oninput="filterHistory()"
        autocomplete="off"
      />
    </div>

    <div class="category-filter-wrapper">
      <label class="visually-hidden" for="category-filter">
        Filtrar por categoría
      </label>

      <select
        class="select-filter"
        id="category-filter"
        onchange="filterHistory()"
      >
        <option value="all">Todas las categorías</option>
        <option value="Movilidad">Movilidad</option>
        <option value="Naturaleza">Naturaleza</option>
        <option value="Participación">Participación</option>
        <option value="Reciclaje">Reciclaje</option>
      </select>
    </div>
  </div>

  <div class="card table-card">
    <div class="table-responsive">
      <table class="history-table">
        <thead>
          <tr>
            <th class="th-left" scope="col">ACCIÓN</th>
            <th class="th-general" scope="col">FECHA</th>
            <th class="th-general" scope="col">CATEGORÍA</th>
            <th class="th-general" scope="col">IMPACTO</th>
            <th class="th-right" scope="col">PUNTOS</th>
          </tr>
        </thead>

        <tbody id="history-table-body">
          <tr>
            <td class="history-loading" colspan="5">
              Cargando tu historial...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
